[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loud-robotics"
dynamic = ["version"]
description = "A robotics package for Gaussian Process-based dynamics modeling and planar robot simulation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sicelukwanda", email = "your.email@example.com"},
]
keywords = ["robotics", "gaussian-processes", "dynamics", "simulation", "planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch==2.6.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "GPy>=1.10.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/Sicelukwanda/loud-robotics"
Repository = "https://github.com/Sicelukwanda/loud-robotics"
Issues = "https://github.com/Sicelukwanda/loud-robotics/issues"

[tool.hatch.version]
path = "loud_robotics/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["loud_robotics"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["loud_robotics"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=loud_robotics",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
]
